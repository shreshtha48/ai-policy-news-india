name: Pipeline + dashboard

on:
  schedule:
    - cron: "30 0 * * *"          # 06:00 IST daily: fetch news, rebuild data, redeploy
  workflow_dispatch: {}            # "Run workflow" button (runs the pipeline too)
  push:                            # your own commits: just rebuild + redeploy the dashboard
    branches: [main]
    paths: ["dashboard/**", "data/processed/**", "data/reference/**", "scripts/sync_dashboard_data.py",
            ".github/workflows/pipeline.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Restore caches (model, embeddings, decoded links, article leads)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            data/cache
          key: pipeline-cache-${{ github.run_id }}
          restore-keys: pipeline-cache-
      - name: Install (CPU-only PyTorch keeps this fast)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - run: python -m unittest discover -s tests -t .
      - name: Fetch + process
        env:
          GNEWS_API_KEY: ${{ secrets.GNEWS_API_KEY }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          NEWSDATA_API_KEY: ${{ secrets.NEWSDATA_API_KEY }}
        run: python -m pipeline.run all
      - name: Commit data
        run: |
          git config user.name "pipeline-bot"
          git config user.email "pipeline-bot@users.noreply.github.com"
          git add data/raw data/processed
          git diff --cached --quiet || git commit -m "data: scheduled fetch $(date -u +%F)"
          git pull --rebase --autostash
          git push

  deploy:
    needs: pipeline
    if: always() && (needs.pipeline.result == 'success' || needs.pipeline.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}      # latest main, including the data commit above
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: python3 scripts/sync_dashboard_data.py
      - run: npm ci
        working-directory: dashboard
      - run: npm run build             # -> site/
        working-directory: dashboard
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
